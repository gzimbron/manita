<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Smack · Ink doodles (50s b&w)</title><style>*{box-sizing:border-box}body{margin:0;background:#F4F1EA;color:#111;font-family:"Futura","Avenir Next",system-ui,sans-serif}
header{padding:20px 40px;border-bottom:4px double #111}h1{margin:0;font:italic 900 34px Georgia,serif}p{margin:6px 0 0;color:#3A3A3A}
.stage{position:relative;margin:24px 40px;height:620px;border:3px solid #111;border-radius:8px;background:#FFFFFF;overflow:hidden;cursor:crosshair}
.stage::after{content:"Click here (try 3 fast clicks)";position:absolute;left:20px;top:14px;font-weight:800;letter-spacing:3px;text-transform:uppercase;font-size:13px;color:#3A3A3A}
svg.fx{position:absolute;pointer-events:none;overflow:visible}
@media (prefers-reduced-motion:reduce){svg.fx{animation:none!important;opacity:0}}</style></head><body>
<header><h1>Ink doodles (50s b&w)</h1><p>Black-and-white hand-drawn cartoon marks (ticks, sparkles, zigzags, puffs, !!, swirls); expressive and on-style; busier on wild streaks. One or two taps: a few light emphasis marks. Three fast taps: a burst of random doodles around the hand.</p></header>
<main><div class="stage" role="application" aria-label="Click to preview the ink doodle tap effect"></div></main>
<script>const stage=document.querySelector('.stage');let last=0,streak=0;
const INK='#111';const S=`fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"`;
// Original hand-drawn style ink marks, each drawn around (0,0) in a ~40 unit box.
const MARKS={
 ticks:()=>`<g ${S}><path d="M-12 8 L-14 -10"/><path d="M-4 8 L-4 -14"/><path d="M4 8 L5 -12"/><path d="M12 8 L14 -9"/></g>`,
 sparkle:()=>`<path d="M0 -14 Q2 -2 14 0 Q2 2 0 14 Q-2 2 -14 0 Q-2 -2 0 -14Z" ${S} fill="#fff"/>`,
 star:()=>`<path d="M0 -12 L3.5 -4 L12 -3.5 L5.5 2 L7.5 11 L0 6.5 L-7.5 11 L-5.5 2 L-12 -3.5 L-3.5 -4Z" ${S} fill="#fff"/>`,
 zigzag:()=>`<path d="M-16 6 L-9 -8 L-3 4 L3 -10 L9 3 L16 -7" ${S}/>`,
 shock:()=>`<path d="M-6 -14 L4 -3 L-3 0 L8 14" ${S}/><path d="M6 -12 L12 -4" ${S}/>`,
 swirl:()=>`<path d="M0 0 Q4 -1 3 3 Q0 7 -4 3 Q-8 -3 -1 -7 Q8 -10 10 0 Q11 11 -1 12" ${S}/>`,
 puff:()=>`<path d="M-12 6 Q-18 0 -11 -5 Q-10 -13 -2 -10 Q4 -16 9 -9 Q17 -8 13 0 Q17 7 9 9 Q3 14 -3 9 Q-10 12 -12 6Z" ${S} fill="#fff"/><path d="M-4 -1 Q0 -4 4 -1" ${S} stroke-width="1.8"/>`,
 bang:()=>`<g ${S} stroke-width="3.4"><path d="M-6 -14 L-5 4"/><path d="M5 -14 L4 4"/></g><g fill="${INK}"><circle cx="-5" cy="11" r="2.3"/><circle cx="4" cy="11" r="2.3"/></g>`,
 vein:()=>`<g ${S} stroke-width="3"><path d="M-10 -3 Q-3 -3 -3 -10"/><path d="M10 -3 Q3 -3 3 -10"/><path d="M-10 3 Q-3 3 -3 10"/><path d="M10 3 Q3 3 3 10"/></g>`,
 drops:()=>`<g ${S} fill="#fff"><path d="M-8 -10 Q-2 -2 -8 4 Q-14 -2 -8 -10Z"/><path d="M6 -4 Q11 2 6 7 Q1 2 6 -4Z"/></g>`,
 scribble:()=>`<path d="M-10 0 C-14 -12 10 -14 11 -3 C12 8 -11 12 -11 2 C-11 -7 7 -9 7 0 C7 6 -5 7 -5 1" ${S}/>`,
 rays:()=>`<g ${S}><path d="M0 -15 L0 -8"/><path d="M11 -11 L6 -6"/><path d="M15 0 L8 0"/><path d="M-11 -11 L-6 -6"/><path d="M-15 0 L-8 0"/></g>`
};
const LIGHT=['ticks','sparkle','rays','star'];
const WILD=['zigzag','shock','swirl','puff','bang','vein','drops','scribble','sparkle','star','ticks'];
function mark(name,x,y,size,rot,delay){const el=document.createElementNS('http://www.w3.org/2000/svg','svg');el.setAttribute('class','fx');el.setAttribute('viewBox','-20 -20 40 40');
 Object.assign(el.style,{left:(x-size/2)+'px',top:(y-size/2)+'px',width:size+'px',height:size+'px'});el.innerHTML=MARKS[name]();stage.appendChild(el);
 const t=`rotate(${rot}deg)`;const a=el.animate([{transform:t+' scale(.2)',opacity:0},{transform:t+' scale(1.15)',opacity:1,offset:.25},{transform:t+' scale(1)',opacity:1,offset:.6},{transform:t+' scale(.95)',opacity:0}],{duration:520,delay,easing:'cubic-bezier(.2,.9,.3,1.3)',fill:'both'});a.onfinish=()=>el.remove();}
stage.addEventListener('pointerdown',e=>{const r=stage.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;const now=performance.now();streak=(now-last<450)?streak+1:1;last=now;
 if(streak<3){ // one or two light marks just above-left of the tap
   mark('rays',x,y,70,0,0); mark(LIGHT[(streak)%LIGHT.length],x-34,y-30,34,-15,40);
 }else{ // wild: 4-6 marks scattered around, bigger
   const n=4+Math.min(2,streak-3);for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2+Math.random()*.6;const d=46+Math.random()*24;
     mark(WILD[Math.floor(Math.random()*WILD.length)],x+Math.cos(a)*d,y+Math.sin(a)*d,40+Math.random()*22,Math.random()*40-20,i*30);}
   mark('rays',x,y,90,0,0);
 }});</script></body></html>
